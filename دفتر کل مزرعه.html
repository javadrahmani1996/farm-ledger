<style>

    --bg:#F3EFE0; --surface:#FFFFFF; --surface-alt:#EAE3CA;
    --primary:#33472C; --primary-light:#5B7A45; --primary-pale:#DEE6D2;
    --accent:#B8862E; --accent-pale:#F3E4C2;
    --rust:#9C4A34; --rust-pale:#F1DDD3;

  .icon-btn{width:38px;height:38px;border-radius:12px;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--primary);cursor:pointer;flex-shrink:0;}

  .back-row{display:flex;align-items:center;gap:10px;}
  .view{padding:0 16px 20px;animation:fadeUp .25s ease;}

  .section-title{font-size:14px;font-weight:700;color:var(--primary);margin:20px 2px 10px;display:flex;justify-content:space-between;align-items:center;}
  .section-title .link{font-size:12px;font-weight:500;color:var(--accent);cursor:pointer;}
  .card{background:var(--surface);border-radius:var(--radius-m);padding:16px;box-shadow:var(--shadow);border:1px solid rgba(37,42,32,0.04);}
  .empty{text-align:center;color:var(--text-muted);font-size:13px;padding:26px 10px;background:var(--surface);border-radius:var(--radius-m);border:1px dashed var(--border);}
  .row-item{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:var(--radius-m);padding:12px 14px;margin-bottom:9px;box-shadow:var(--shadow);cursor:pointer;}
  .row-badge{width:40px;height:40px;border-radius:12px;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
  .row-badge svg{width:18px;height:18px;}
  .b-green{background:var(--primary-pale);color:var(--primary);}
  .b-rust{background:var(--rust-pale);color:var(--rust);}
  .b-gold{background:var(--accent-pale);color:var(--accent);}
  .row-main{flex:1;min-width:0;}
  .row-title{font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .row-sub{font-size:11.5px;color:var(--text-muted);margin-top:2px;}
  .row-end{text-align:left;flex-shrink:0;}
  .row-amount{font-size:13px;font-weight:800;}
  .pos{color:var(--primary);} .neg{color:var(--rust);}
  .row-date{font-size:10.5px;color:var(--text-muted);margin-top:2px;}
  .date-group-lbl{font-size:11px;font-weight:700;color:var(--text-muted);margin:16px 2px 8px;}
  .subtabs{display:flex;gap:8px;margin-bottom:14px;overflow-x:auto;}
  .subtabs button{border:1px solid var(--border);background:var(--surface);color:var(--text-muted);font-family:inherit;font-size:12.5px;font-weight:600;padding:8px 14px;border-radius:999px;white-space:nowrap;cursor:pointer;}
  .subtabs button.active{background:var(--primary);border-color:var(--primary);color:#fff;}
  .totals-bar{display:flex;justify-content:space-between;background:var(--primary);color:#fff;border-radius:var(--radius-m);padding:12px 14px;margin-bottom:14px;font-size:11.5px;gap:6px;}
  .totals-bar b{display:block;font-size:13.5px;margin-top:2px;}
  .stat-row{display:flex;gap:10px;}
  .stat{flex:1;background:var(--surface);border-radius:var(--radius-m);padding:13px 11px;box-shadow:var(--shadow);}
  .stat .lbl{font-size:11px;color:var(--text-muted);font-weight:500;}
  .stat .val{font-size:15.5px;font-weight:800;margin-top:6px;}
  .stat.income .val{color:var(--primary);} .stat.expense .val{color:var(--rust);} .stat.profit .val{color:var(--accent);}
  .fab{position:fixed;left:50%;transform:translateX(190px);bottom:26px;width:54px;height:54px;border-radius:18px;background:var(--accent);box-shadow:0 6px 16px rgba(184,134,46,0.45);display:flex;align-items:center;justify-content:center;border:none;cursor:pointer;z-index:40;}
  @media(max-width:480px){.fab{left:auto;right:18px;transform:none;}}
  .fab svg{width:24px;height:24px;color:#fff;}
  .overlay{position:fixed;inset:0;background:rgba(30,32,20,0.42);display:flex;align-items:flex-end;justify-content:center;z-index:100;opacity:0;pointer-events:none;transition:opacity .2s;}
  .overlay.open{opacity:1;pointer-events:auto;}
  .sheet{width:100%;max-width:480px;background:var(--bg);border-radius:22px 22px 0 0;padding:18px 18px 24px;max-height:90vh;overflow-y:auto;transform:translateY(16px);transition:transform .22s;}
  .overlay.open .sheet{transform:translateY(0);}
  .sheet-handle{width:40px;height:4px;background:var(--border);border-radius:99px;margin:0 auto 14px;}
  .sheet-title{font-size:16px;font-weight:800;color:var(--primary);margin-bottom:16px;}
  .field{margin-bottom:13px;}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--text-muted);margin-bottom:6px;}
  .field input,.field select,.field textarea{width:100%;border:1px solid var(--border);background:var(--surface);border-radius:var(--radius-s);padding:11px 12px;font-family:inherit;font-size:13.5px;color:var(--text);}

  .jalali-row{display:flex;gap:6px;}
  .jalali-row select{flex:1;padding:11px 4px;font-size:12.5px;}
  .seg{display:flex;gap:8px;}
  .seg button{flex:1;padding:10px 0;border-radius:var(--radius-s);border:1px solid var(--border);background:var(--surface);font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer;color:var(--text-muted);}
  .seg button.on-a.active{background:var(--primary-pale);border-color:var(--primary);color:var(--primary);}
  .seg button.on-b.active{background:var(--rust-pale);border-color:var(--rust);color:var(--rust);}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .computed-total{background:var(--accent-pale);border-radius:var(--radius-s);padding:10px 12px;display:flex;justify-content:space-between;align-items:center;margin-bottom:13px;font-size:13px;font-weight:700;color:var(--accent);}
  .btn{width:100%;padding:13px 0;border-radius:var(--radius-s);border:none;background:var(--primary);color:#fff;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;margin-top:4px;}
  .btn.secondary{background:var(--surface);color:var(--rust);border:1px solid var(--rust-pale);}
  .btn.ghost{background:var(--surface-alt);color:var(--text);}
  .toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--primary);color:#fff;padding:10px 20px;border-radius:999px;font-size:12.5px;font-weight:600;box-shadow:0 6px 16px rgba(0,0,0,0.2);z-index:200;opacity:0;pointer-events:none;transition:opacity .25s, transform .25s;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}
  .bottomnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--surface);border-top:1px solid var(--border);display:flex;padding:8px 4px calc(8px + env(safe-area-inset-bottom));z-index:30;}
  .navbtn{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:none;font-family:inherit;color:var(--text-muted);font-size:10px;font-weight:600;padding:4px 0;cursor:pointer;}
  .navbtn svg{width:19px;height:19px;}

  .land-card{background:var(--surface);border-radius:var(--radius-m);padding:16px;margin-bottom:10px;box-shadow:var(--shadow);cursor:pointer;}
  .land-card .lname{font-size:15px;font-weight:800;color:var(--primary);}
  .land-card .lstats{display:flex;gap:16px;margin-top:8px;}
  .land-card .lstats div{font-size:11px;color:var(--text-muted);}
  .land-card .lstats b{display:block;font-size:13px;color:var(--text);margin-top:2px;}
  .signin-wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;text-align:center;}
  .signin-wrap .mark{width:70px;height:70px;border-radius:22px;background:var(--primary);display:flex;align-items:center;justify-content:center;margin-bottom:20px;}
  .signin-wrap .mark svg{width:36px;height:36px;color:var(--accent-pale);}
  .signin-wrap h1{font-size:19px;color:var(--primary);margin:0 0 8px;}
  .signin-wrap p{font-size:13px;color:var(--text-muted);margin:0 0 26px;line-height:1.9;}
  .google-btn{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:13px 22px;font-family:inherit;font-size:14px;font-weight:700;color:var(--text);cursor:pointer;box-shadow:var(--shadow);}
  .center-loading{min-height:100vh;display:flex;align-items:center;justify-content:center;color:var(--text-muted);font-size:13px;}
  .rate-card{background:var(--surface-alt);border-radius:var(--radius-s);padding:12px;margin-bottom:14px;font-size:12px;color:var(--text-muted);}
  .rate-card b{color:var(--text);}
  .bar-row{margin-bottom:12px;}
  .bar-row .bar-lbl{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px;}
  .bar-track{height:9px;background:var(--surface-alt);border-radius:99px;overflow:hidden;}
  .bar-fill{height:100%;background:var(--primary-light);border-radius:99px;}
  .checkline{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text-muted);margin-bottom:13px;}
</style>
</head>

<script type="module">

/* ================= JALALI CALENDAR ================= */
function jdiv(a,b){return ~~(a/b);}
function jmod(a,b){return a-~~(a/b)*b;}
function jalCal(jy){
  const breaks=[-61,9,38,199,426,686,756,818,1111,1181,1210,1635,2060,2097,2192,2262,2324,2394,2456,3178];
  const bl=breaks.length; let gy=jy+621, leapJ=-14, jp=breaks[0], jm,jump,leap,n,i;
  for(i=1;i<bl;i+=1){ jm=breaks[i]; jump=jm-jp; if(jy<jm) break; leapJ=leapJ+jdiv(jump,33)*8+jdiv(jmod(jump,33),4); jp=jm; }
  n=jy-jp;
  leapJ=leapJ+jdiv(n,33)*8+jdiv(jmod(n,33)+3,4);
  if(jmod(jump,33)===4 && jump-n===4) leapJ+=1;
  const leapG=jdiv(gy,4)-jdiv((jdiv(gy,100)+1)*3,4)-150;
  const march=20+leapJ-leapG;
  if(jump-n<6) n=n-jump+jdiv(jump,33)*33;
  leap=jmod(jmod(n+1,33)-1,4); if(leap===-1) leap=4;
  return {leap,gy,march};
}
function g2d(gy,gm,gd){
  let d=jdiv((gy+jdiv(gm-8,6)+100100)*1461,4)+jdiv(153*jmod(gm+9,12)+2,5)+gd-34840408;
  d=d-jdiv(jdiv(gy+jdiv(gm-8,6)+100100,100)*3,4)+752;
  return d;
}
function j2d(jy,jm,jd){ const r=jalCal(jy); return g2d(r.gy,3,r.march)+(jm-1)*31-jdiv(jm,7)*(jm-7)+jd-1; }
function d2g(jdn){
  let j=4*jdn+139361631;
  j=j+jdiv(jdiv(4*jdn+183187720,146097)*3,4)*4-3908;
  const i=jdiv(jmod(j,1461),4)*5+308;
  const gd=jdiv(jmod(i,153),5)+1;
  const gm=jmod(jdiv(i,153),12)+1;
  const gy=jdiv(j,1461)-100100+jdiv(8-gm,6);
  return [gy,gm,gd];
}
function d2j(jdn){
  const gy=d2g(jdn)[0]; let jy=gy-621; const r=jalCal(jy); const jdn1f=g2d(gy,3,r.march);
  let k=jdn-jdn1f, jm,jd;
  if(k>=0){ if(k<=185){ jm=1+jdiv(k,31); jd=jmod(k,31)+1; return [jy,jm,jd]; } else k-=186; }
  else { jy-=1; k+=179; if(r.leap===1) k+=1; }
  jm=7+jdiv(k,30); jd=jmod(k,30)+1; return [jy,jm,jd];
}
function toJalaali(gy,gm,gd){ return d2j(g2d(gy,gm,gd)); }
function toGregorian(jy,jm,jd){ return d2g(j2d(jy,jm,jd)); }
function jIsLeap(jy){ return jalCal(jy).leap===0; }
function jDaysInMonth(jy,jm){ if(jm<=6) return 31; if(jm<=11) return 30; return jIsLeap(jy)?30:29; }
const J_MONTHS=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];

function isoFromJalali(jy,jm,jd){
  const [gy,gm,gd]=toGregorian(jy,jm,jd);
  return gy.toString().padStart(4,'0')+'-'+String(gm).padStart(2,'0')+'-'+String(gd).padStart(2,'0');
}
function jalaliFromIso(iso){
  const [gy,gm,gd]=iso.split('-').map(Number);
  return toJalaali(gy,gm,gd);
}
function todayIso(){
  const d=new Date();
  return d.getFullYear().toString().padStart(4,'0')+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function faDateLabel(iso){
  if(!iso) return '';
  const [jy,jm,jd]=jalaliFromIso(iso);
  return jd+' '+J_MONTHS[jm-1]+' '+jy;
}
function faDateShort(iso){
  const [jy,jm,jd]=jalaliFromIso(iso);
  return jd+' '+J_MONTHS[jm-1];
}
function currentJalaliYear(){ const t=todayIso(); return jalaliFromIso(t)[0]; }

/* Jalali date-picker widget: renders 3 selects, id prefix given */
function jalaliPickerHTML(prefix, iso){
  const [jy,jm,jd]=jalaliFromIso(iso||todayIso());
  const cy=currentJalaliYear();
  let yearsOpt='';
  for(let y=cy+1;y>=cy-6;y--) yearsOpt+=`<option value="${y}" ${y===jy?'selected':''}>${y}</option>`;
  let monthsOpt='';
  J_MONTHS.forEach((mn,idx)=>{ monthsOpt+=`<option value="${idx+1}" ${idx+1===jm?'selected':''}>${mn}</option>`; });
  const dim=jDaysInMonth(jy,jm);
  let daysOpt='';
  for(let d=1;d<=dim;d++) daysOpt+=`<option value="${d}" ${d===jd?'selected':''}>${d}</option>`;
  return `<div class="jalali-row">
    <select id="${prefix}_y" onchange="refreshJalaliDays('${prefix}')">${yearsOpt}</select>
    <select id="${prefix}_m" onchange="refreshJalaliDays('${prefix}')">${monthsOpt}</select>
    <select id="${prefix}_d">${daysOpt}</select>
  </div>`;
}
window.refreshJalaliDays=function(prefix){
  const y=parseInt(document.getElementById(prefix+'_y').value);
  const m=parseInt(document.getElementById(prefix+'_m').value);
  const daySel=document.getElementById(prefix+'_d');
  const cur=parseInt(daySel.value)||1;
  const dim=jDaysInMonth(y,m);
  let opts='';
  for(let d=1;d<=dim;d++) opts+=`<option value="${d}" ${d===Math.min(cur,dim)?'selected':''}>${d}</option>`;
  daySel.innerHTML=opts;
};
function readJalaliPicker(prefix){
  const y=parseInt(document.getElementById(prefix+'_y').value);
  const m=parseInt(document.getElementById(prefix+'_m').value);
  const d=parseInt(document.getElementById(prefix+'_d').value);
  return isoFromJalali(y,m,d);
}

/* ================= HELPERS ================= */

function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),1800);
}
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function escapeAttr(s){ return String(s==null?'':s).replace(/"/g,'&quot;'); }

/* ================= ICONS ================= */
const ICONS = {

  exchange:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h13l-3-3"/><path d="M20 16H7l3 3"/></svg>',

/* ================= FIRESTORE PATHS ================= */
function uid(){ return CURRENT_USER.uid; }
function landsCol(){ return collection(db,'users',uid(),'lands'); }
function subCol(landId, name){ return collection(db,'users',uid(),'lands',landId,name); }
function entriesCol(landId, parentCol, parentId){ return collection(db,'users',uid(),'lands',landId,parentCol,parentId,'entries'); }
function logsCol(landId, parentCol, parentId){ return collection(db,'users',uid(),'lands',landId,parentCol,parentId,'logs'); }

async function listDocs(colRef){
  const snap = await getDocs(colRef);
  const out=[]; snap.forEach(d=>out.push({id:d.id,...d.data()}));
  return out;
}
async function addD(colRef, data){ return await addDoc(colRef, {...data, createdAt: Date.now()}); }
async function updD(colRef, id, data){ return await updateDoc(doc(colRef,id), data); }
async function delD(colRef, id){ return await deleteDoc(doc(colRef,id)); }

/* ================= APP STATE ================= */
let NAV = {screen:'lands'};
let CACHE = { lands:[], vendors:{}, vendorEntries:{}, buyers:{}, buyerEntries:{}, workers:{}, workerLogs:{}, foremen:{}, foremanLogs:{}, operations:{} };
let workerTab = 'individual';
let dashPeriodGlobal = 'all';

async function preloadForScreen(nav){
  switch(nav.screen){
    case 'lands': await refreshLands(); break;
    case 'vendors': {
      await refreshVendors(nav.landId);
      await Promise.all((CACHE.vendors[nav.landId]||[]).map(v=>refreshVendorEntries(nav.landId, v.id)));
      break;
    }
    case 'buyers': {
      await refreshBuyers(nav.landId);
      await Promise.all((CACHE.buyers[nav.landId]||[]).map(b=>refreshBuyerEntries(nav.landId, b.id)));
      break;
    }
    case 'workers': {
      await Promise.all([refreshWorkers(nav.landId), refreshForemen(nav.landId)]);
      await Promise.all([
        ...((CACHE.workers[nav.landId]||[]).map(w=>refreshWorkerLogs(nav.landId, w.id))),
        ...((CACHE.foremen[nav.landId]||[]).map(f=>refreshForemanLogs(nav.landId, f.id))),
      ]);
      break;
    }
    case 'operations': await refreshOperations(nav.landId); break;
    case 'vendorDetail': await refreshVendorEntries(nav.landId, nav.vendorId); break;
    case 'buyerDetail': await refreshBuyerEntries(nav.landId, nav.buyerId); break;
    case 'workerDetail': await refreshWorkerLogs(nav.landId, nav.workerId); break;
    case 'foremanDetail': await refreshForemanLogs(nav.landId, nav.foremanId); break;
    case 'landAudit': delete LAND_AUDIT_CACHE[nav.landId]; break;
    case 'globalAudit': GLOBAL_AUDIT_CACHE=null; break;
  }
}
async function go(nav){
  NAV = nav;
  document.getElementById('root').innerHTML = topbarHTML() + '<div class="view"><div class="center-loading" style="min-height:200px">در حال بارگذاری...</div></div>' + landBottomNavHTML();
  await preloadForScreen(nav);
  render();
  window.scrollTo(0,0);
}

/* ================= DATA REFRESH ================= */
async function refreshLands(){ CACHE.lands = await listDocs(landsCol()); }
async function refreshVendors(landId){ CACHE.vendors[landId] = await listDocs(subCol(landId,'vendors')); }
async function refreshVendorEntries(landId, vendorId){ CACHE.vendorEntries[vendorId] = await listDocs(entriesCol(landId,'vendors',vendorId)); }
async function refreshBuyers(landId){ CACHE.buyers[landId] = await listDocs(subCol(landId,'buyers')); }
async function refreshBuyerEntries(landId, buyerId){ CACHE.buyerEntries[buyerId] = await listDocs(entriesCol(landId,'buyers',buyerId)); }
async function refreshWorkers(landId){ CACHE.workers[landId] = await listDocs(subCol(landId,'workers')); }
async function refreshWorkerLogs(landId, workerId){ CACHE.workerLogs[workerId] = await listDocs(logsCol(landId,'workers',workerId)); }
async function refreshForemen(landId){ CACHE.foremen[landId] = await listDocs(subCol(landId,'foremen')); }
async function refreshForemanLogs(landId, foremanId){ CACHE.foremanLogs[foremanId] = await listDocs(logsCol(landId,'foremen',foremanId)); }
async function refreshOperations(landId){ CACHE.operations[landId] = await listDocs(subCol(landId,'operations')); }

/* ================= BALANCE CALC ================= */
function vendorBalance(entries){
  let bal=0; (entries||[]).forEach(e=>{ bal += e.type==='purchase' ? (e.amount||0) : -(e.amount||0); });
  return bal;
}
function buyerBalance(entries){
  let bal=0; (entries||[]).forEach(e=>{ bal += e.type==='sale' ? (e.total||0) : -(e.amount||0); });
  return bal;
}
function workerWageSum(logs){ return (logs||[]).reduce((s,l)=>s+(l.wage||0),0); }

function render(){
  const root=document.getElementById('root');
  root.innerHTML = topbarHTML() + '<div class="view">' + screenHTML() + '</div>' + fabHTML() + landBottomNavHTML();
}
function fmtRial(n){ return fmt(n)+' ریال'; }

function topbarHTML(){
  const s=NAV.screen;
  if(s==='lands' || s==='globalAudit'){
    return `<div class="topbar">
      <div><div class="ttl">دفتر کل مزرعه</div><div class="sub">${escapeHtml(CURRENT_USER.displayName||CURRENT_USER.email||'')}</div></div>
      <div class="icon-btn" onclick="doSignOut()">${ICONS.logout}</div>
    </div>`;
  }
  const land = CACHE.lands.find(l=>l.id===NAV.landId);
  const landName = land? land.name : '';
  let title='', back=null;
  if(s==='landHome') { title=landName; back={screen:'lands'}; }
  else if(['vendors','buyers','workers','operations','landAudit'].includes(s)) { title=landName; back={screen:'landHome',landId:NAV.landId}; }
  else if(s==='vendorDetail') { title=(CACHE.vendors[NAV.landId]||[]).find(v=>v.id===NAV.vendorId)?.name||''; back={screen:'vendors',landId:NAV.landId}; }
  else if(s==='buyerDetail') { title=(CACHE.buyers[NAV.landId]||[]).find(b=>b.id===NAV.buyerId)?.name||''; back={screen:'buyers',landId:NAV.landId}; }
  else if(s==='workerDetail') { title=(CACHE.workers[NAV.landId]||[]).find(w=>w.id===NAV.workerId)?.name||''; back={screen:'workers',landId:NAV.landId}; }
  else if(s==='foremanDetail') { title=(CACHE.foremen[NAV.landId]||[]).find(f=>f.id===NAV.foremanId)?.name||''; back={screen:'workers',landId:NAV.landId}; }
  return `<div class="topbar">
    <div class="back-row"><div class="icon-btn" onclick='go(${JSON.stringify(back)})'>${ICONS.back}</div><div class="ttl">${escapeHtml(title)}</div></div>
  </div>`;
}

function landBottomNavHTML(){
  if(!['landHome','vendors','buyers','workers','operations','landAudit'].includes(NAV.screen)) return '';
  const landId=NAV.landId;
  const items=[
    ['landHome',ICONS.land,'زمین'],
    ['vendors',ICONS.exchange,'هزینه'],
    ['workers',ICONS.workers,'کارگر'],
    ['buyers',ICONS.sell,'فروش'],
    ['operations',ICONS.ops,'عملیات'],
    ['landAudit',ICONS.audit,'حسابرسی'],
  ];
  return '<div class="bottomnav">'+items.map(([id,icon,lbl])=>`
    <button class="navbtn ${NAV.screen===id?'active':''}" onclick='go({screen:"${id}",landId:"${landId}"})'>${icon}<span>${lbl}</span></button>
  `).join('')+'</div>';
}

function fabHTML(){
  const s=NAV.screen;
  let action=null;
  if(s==='lands') action="openLandSheet()";
  else if(s==='vendors') action="openVendorSheet('"+NAV.landId+"')";
  else if(s==='vendorDetail') action=`openVendorEntrySheet('${NAV.landId}','${NAV.vendorId}')`;
  else if(s==='buyers') action="openBuyerSheet('"+NAV.landId+"')";
  else if(s==='buyerDetail') action=`openBuyerEntrySheet('${NAV.landId}','${NAV.buyerId}')`;
  else if(s==='workers') action = workerTab==='individual' ? `openWorkerSheet('${NAV.landId}')` : `openForemanSheet('${NAV.landId}')`;
  else if(s==='workerDetail') action=`openWorkerLogSheet('${NAV.landId}','${NAV.workerId}')`;
  else if(s==='foremanDetail') action=`openForemanLogSheet('${NAV.landId}','${NAV.foremanId}')`;
  else if(s==='operations') action=`openOperationSheet('${NAV.landId}')`;
  if(!action) return '';
  return `<button class="fab" onclick="${action}">${ICONS.plus}</button>`;
}

  const w=(CACHE.workers[landId]||[]).find(x=>x.id===workerId);
  await addD(logsCol(landId,'workers',workerId), {type:'full', date:todayIso(), wage:w.fullRate});
  await refreshWorkerLogs(landId,workerId); render(); toast('ثبت شد');
};
window.addHalfDay=async function(landId,workerId){
  const w=(CACHE.workers[landId]||[]).find(x=>x.id===workerId);
  await addD(logsCol(landId,'workers',workerId), {type:'half', date:todayIso(), wage:w.halfRate});
  await refreshWorkerLogs(landId,workerId); render(); toast('ثبت شد');
};
window.removeLastLog=async function(landId,workerId,type){
  const logs=(CACHE.workerLogs[workerId]||[]).filter(l=>l.type===type).sort((a,b)=>b.createdAt-a.createdAt);
  if(!logs.length){ toast('رکوردی نیست'); return; }
  await delD(logsCol(landId,'workers',workerId), logs[0].id);
  await refreshWorkerLogs(landId,workerId); render(); toast('حذف شد');
};
window.adjustOt=async function(landId,workerId,deltaMin){
  const w=(CACHE.workers[landId]||[]).find(x=>x.id===workerId);
  const today=todayIso();
  const logs=CACHE.workerLogs[workerId]||[];
  let todayOt = logs.find(l=>l.type==='ot' && l.date===today);
  if(!todayOt){
    if(deltaMin<0){ toast('اضافه‌کاری امروز صفره'); return; }
    const wage = w.otRate * (deltaMin/60);
    await addD(logsCol(landId,'workers',workerId), {type:'ot', date:today, otMinutes:deltaMin, wage});
  } else {
    const newMin = Math.max(0, (todayOt.otMinutes||0)+deltaMin);
    if(newMin===0){
      await delD(logsCol(landId,'workers',workerId), todayOt.id);
    } else {
      const wage = w.otRate * (newMin/60);
      await updD(logsCol(landId,'workers',workerId), todayOt.id, {otMinutes:newMin, wage});
    }
  }
  await refreshWorkerLogs(landId,workerId); render(); toast('بروزرسانی شد');
};

    ${logs.length? logs.map(l=>foremanLogRow(l)).join('') : emptyHTML('هنوز روزی ثبت نشده')}
  `;
}
function foremanLogRow(l){
  return `<div class="row-item" onclick="openForemanLogSheet('${NAV.landId}','${NAV.foremanId}','${l.id}')">
    <div class="row-badge b-gold">${ICONS.workers}</div>
    <div class="row-main"><div class="row-title">مرد ${fmt(l.mFull)}کامل/${fmt(l.mHalf)}نصف &nbsp; زن ${fmt(l.fFull)}کامل/${fmt(l.fHalf)}نصف</div>
      <div class="row-sub">اضافه‌کاری: مرد ${l.mOtCount||0}نفر×${l.mOtHours||0}س، زن ${l.fOtCount||0}نفر×${l.fOtHours||0}س</div></div>
    <div class="row-end"><div class="row-amount pos">${fmt(l.wage)}</div><div class="row-date">${faDateShort(l.date)}</div></div>
  </div>`;
}
function computeForemanWage(f, mFull,mHalf,fFull,fHalf,mOtCount,mOtHours,fOtCount,fOtHours){
  return mFull*f.mFullRate + mHalf*f.mHalfRate + fFull*f.fFullRate + fHalf*f.fHalfRate
       + mOtCount*mOtHours*f.mOtRate + fOtCount*fOtHours*f.fOtRate;
}

/* ================= LAND AUDIT ================= */
async function computeLandTotals(landId){
  const vendors = CACHE.vendors[landId] || await (async()=>{const v=await listDocs(subCol(landId,'vendors'));CACHE.vendors[landId]=v;return v;})();
  const buyers = CACHE.buyers[landId] || await (async()=>{const b=await listDocs(subCol(landId,'buyers'));CACHE.buyers[landId]=b;return b;})();
  const workers = CACHE.workers[landId] || await (async()=>{const w=await listDocs(subCol(landId,'workers'));CACHE.workers[landId]=w;return w;})();
  const foremen = CACHE.foremen[landId] || await (async()=>{const f=await listDocs(subCol(landId,'foremen'));CACHE.foremen[landId]=f;return f;})();

  let totalPurchased=0, totalPaidToVendors=0, debt=0;
  const vendorBreak=[];
  for(const v of vendors){
    const entries = CACHE.vendorEntries[v.id] || await (async()=>{const e=await listDocs(entriesCol(landId,'vendors',v.id));CACHE.vendorEntries[v.id]=e;return e;})();
    let purchased=0, paid=0;
    entries.forEach(e=>{ if(e.type==='purchase') purchased+=(e.amount||0); else paid+=(e.amount||0); });
    totalPurchased+=purchased; totalPaidToVendors+=paid;
    const bal=purchased-paid;
    if(bal>0) debt+=bal;
    vendorBreak.push({name:v.name, balance:bal});
  }
  let totalSales=0, totalReceivedFromBuyers=0, receivable=0;
  const buyerBreak=[];
  for(const b of buyers){
    const entries = CACHE.buyerEntries[b.id] || await (async()=>{const e=await listDocs(entriesCol(landId,'buyers',b.id));CACHE.buyerEntries[b.id]=e;return e;})();
    let sold=0, paid=0;
    entries.forEach(e=>{ if(e.type==='sale') sold+=(e.total||0); else paid+=(e.amount||0); });
    totalSales+=sold; totalReceivedFromBuyers+=paid;
    const bal=sold-paid;
    if(bal>0) receivable+=bal;
    buyerBreak.push({name:b.name, balance:bal});
  }
  let totalWages=0;
  for(const w of workers){
    const logs = CACHE.workerLogs[w.id] || await (async()=>{const l=await listDocs(logsCol(landId,'workers',w.id));CACHE.workerLogs[w.id]=l;return l;})();
    totalWages += workerWageSum(logs);
  }
  for(const f of foremen){
    const logs = CACHE.foremanLogs[f.id] || await (async()=>{const l=await listDocs(logsCol(landId,'foremen',f.id));CACHE.foremanLogs[f.id]=l;return l;})();
    totalWages += workerWageSum(logs);
  }
  const totalExpenses = totalPurchased + totalWages;
  const profit = totalSales - totalExpenses;
  return {totalPurchased,totalWages,totalExpenses,totalSales,profit,debt,receivable,vendorBreak,buyerBreak};
}

let LAND_AUDIT_CACHE = {};

    return emptyHTML('در حال محاسبه...');

  return `
    <div class="stat-row">
      <div class="stat income"><div class="lbl">فروش کل</div><div class="val">${fmt(t.totalSales)}</div></div>
      <div class="stat expense"><div class="lbl">هزینه کل</div><div class="val">${fmt(t.totalExpenses)}</div></div>
    </div>
    <div class="stat-row" style="margin-top:10px;">

      <div class="stat"><div class="lbl">دستمزد کارگر</div><div class="val">${fmt(t.totalWages)}</div></div>
    </div>
    <div class="stat-row" style="margin-top:10px;">
      <div class="stat"><div class="lbl">بدهی به فروشنده‌ها</div><div class="val" style="color:var(--rust)">${fmt(t.debt)}</div></div>
      <div class="stat"><div class="lbl">طلب از خریداران</div><div class="val" style="color:var(--primary)">${fmt(t.receivable)}</div></div>
    </div>
    <div class="stat-row" style="margin-top:10px;">
      <div class="stat profit" style="flex:1"><div class="lbl">${profitPositive?'سود خالص':'زیان'}</div><div class="val">${fmt(Math.abs(t.profit))}</div></div>
    </div>
    <button class="btn ghost" style="margin-top:16px" onclick="refreshLandAudit('${landId}')">بروزرسانی محاسبه</button>

    <div class="section-title">بدهی به فروشنده‌ها</div>
    ${t.vendorBreak.filter(v=>v.balance!==0).length? t.vendorBreak.filter(v=>v.balance!==0).map(v=>`
      <div class="bar-row"><div class="bar-lbl"><span>${escapeHtml(v.name)}</span><b style="color:${v.balance>0?'var(--rust)':'var(--primary)'}">${fmt(v.balance)}</b></div></div>
    `).join('') : emptyHTML('بدهی باز نیست')}

    <div class="section-title">طلب از خریداران</div>
    ${t.buyerBreak.filter(b=>b.balance!==0).length? t.buyerBreak.filter(b=>b.balance!==0).map(b=>`
      <div class="bar-row"><div class="bar-lbl"><span>${escapeHtml(b.name)}</span><b style="color:${b.balance>0?'var(--primary)':'var(--rust)'}">${fmt(b.balance)}</b></div></div>
    `).join('') : emptyHTML('طلبی باز نیست')}
  `;
}
window.refreshLandAudit=function(landId){ delete LAND_AUDIT_CACHE[landId]; render(); };

/* ================= GLOBAL AUDIT ================= */
let GLOBAL_AUDIT_CACHE = null;
function globalAuditScreen(){
  if(!GLOBAL_AUDIT_CACHE){
    (async()=>{
      const perLand=[];
      for(const l of CACHE.lands){ perLand.push({land:l, totals: await computeLandTotals(l.id)}); }
      GLOBAL_AUDIT_CACHE = perLand;
      if(NAV.screen==='globalAudit') render();
    })();
    return emptyHTML('در حال محاسبه همه زمین‌ها...');
  }
  const perLand=GLOBAL_AUDIT_CACHE;
  const sum=(key)=>perLand.reduce((s,p)=>s+p.totals[key],0);
  const totalSales=sum('totalSales'), totalExpenses=sum('totalExpenses'), profit=sum('profit'), debt=sum('debt'), receivable=sum('receivable');

  // group by name across lands
  const vendorGroups={}, buyerGroups={};
  perLand.forEach(p=>{
    p.totals.vendorBreak.forEach(v=>{
      if(v.balance===0) return;
      const key=v.name.trim();
      vendorGroups[key]=vendorGroups[key]||{name:key,total:0,byLand:[]};
      vendorGroups[key].total+=v.balance;
      vendorGroups[key].byLand.push({land:p.land.name, balance:v.balance});
    });
    p.totals.buyerBreak.forEach(b=>{
      if(b.balance===0) return;
      const key=b.name.trim();
      buyerGroups[key]=buyerGroups[key]||{name:key,total:0,byLand:[]};
      buyerGroups[key].total+=b.balance;
      buyerGroups[key].byLand.push({land:p.land.name, balance:b.balance});
    });
  });

  return `
    <div class="stat-row">
      <div class="stat income"><div class="lbl">جمع فروش همه زمین‌ها</div><div class="val">${fmt(totalSales)}</div></div>
      <div class="stat expense"><div class="lbl">جمع هزینه همه زمین‌ها</div><div class="val">${fmt(totalExpenses)}</div></div>
    </div>
    <div class="stat-row" style="margin-top:10px;">
      <div class="stat"><div class="lbl">بدهی کل</div><div class="val" style="color:var(--rust)">${fmt(debt)}</div></div>
      <div class="stat"><div class="lbl">طلب کل</div><div class="val" style="color:var(--primary)">${fmt(receivable)}</div></div>
    </div>
    <div class="stat-row" style="margin-top:10px;">
      <div class="stat profit"><div class="lbl">${profit>=0?'سود خالص کل':'زیان کل'}</div><div class="val">${fmt(Math.abs(profit))}</div></div>
    </div>
    <button class="btn ghost" style="margin-top:16px" onclick="refreshGlobalAudit()">بروزرسانی محاسبه</button>

    <div class="section-title">سود/زیان به تفکیک هر زمین</div>
    ${perLand.map(p=>`
      <div class="row-item" style="cursor:default">
        <div class="row-badge b-green">${ICONS.land}</div>
        <div class="row-main"><div class="row-title">${escapeHtml(p.land.name)}</div><div class="row-sub">فروش: ${fmt(p.totals.totalSales)} · هزینه: ${fmt(p.totals.totalExpenses)}</div></div>
        <div class="row-end"><div class="row-amount ${p.totals.profit>=0?'pos':'neg'}">${fmt(p.totals.profit)}</div></div>
      </div>
    `).join('')}

    <div class="section-title">بدهی به هر فروشنده (تفکیک زمین)</div>
    ${Object.values(vendorGroups).length? Object.values(vendorGroups).map(g=>`
      <div class="card" style="margin-bottom:9px;">
        <div class="bar-lbl" style="display:flex;justify-content:space-between;font-weight:700;"><span>${escapeHtml(g.name)}</span><span style="color:${g.total>0?'var(--rust)':'var(--primary)'}">${fmt(g.total)}</span></div>
        ${g.byLand.map(x=>`<div style="font-size:11.5px;color:var(--text-muted);margin-top:4px;">${escapeHtml(x.land)}: ${fmt(x.balance)}</div>`).join('')}
      </div>
    `).join('') : emptyHTML('بدهی باز نیست')}

    <div class="section-title">طلب از هر خریدار (تفکیک زمین)</div>
    ${Object.values(buyerGroups).length? Object.values(buyerGroups).map(g=>`
      <div class="card" style="margin-bottom:9px;">
        <div class="bar-lbl" style="display:flex;justify-content:space-between;font-weight:700;"><span>${escapeHtml(g.name)}</span><span style="color:${g.total>0?'var(--primary)':'var(--rust)'}">${fmt(g.total)}</span></div>
        ${g.byLand.map(x=>`<div style="font-size:11.5px;color:var(--text-muted);margin-top:4px;">${escapeHtml(x.land)}: ${fmt(x.balance)}</div>`).join('')}
      </div>
    `).join('') : emptyHTML('طلبی باز نیست')}
  `;
}
